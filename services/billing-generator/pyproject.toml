[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-generator"
version = "0.1.0"
description = "Synthetic, FOCUS-aligned cloud billing data generator for the FinOps platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Denilson" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "Faker>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Enabled in step 2 (message broker). Kept optional so step 1 stays lightweight.
broker = [
    "confluent-kafka>=2.3",
]

[project.scripts]
billing-generator = "billing_generator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
