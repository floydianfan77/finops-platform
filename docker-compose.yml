# ---------------------------------------------------------------------------
# Local development environment for the FinOps platform.
#
# Step 1 (now):   only the billing-generator runs, emitting to stdout/file.
# Step 2 (later): uncomment ONE broker block (Red Panda OR Kafka) and switch
#                 BILLING_SINK=broker. The generator code already supports it.
# ---------------------------------------------------------------------------
services:
  billing-generator:
    build: ./services/billing-generator
    container_name: finops-billing-generator
    env_file:
      - .env
    environment:
      # In-container default; override in .env as needed
      BILLING_SINK: ${BILLING_SINK:-stdout}
    volumes:
      - ./data:/app/data
    # depends_on:
    #   - redpanda      # enable in step 2

